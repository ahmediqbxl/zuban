# Deploy to GitHub Pages.
#
# An alternative to Netlify that needs no third-party account. Note that
# Pages for a *private* repository requires a paid GitHub plan; on a free
# plan either make the repo public or use Netlify instead.
#
# Pages serves from /<repo>/, so BASE_PATH has to be set or every asset
# 404s. ZUBAN_SHOW_DRAFTS ships the unreviewed course — drop it once the
# content has been reviewed.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:content
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          ZUBAN_SHOW_DRAFTS: '1'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
